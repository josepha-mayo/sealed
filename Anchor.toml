[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sealed = "FGVuEoWpDGTqBBuR9e26t2t5mDngXgbrAj5CtuLKXLUZ"
# market intentionally absent: only ONE program gets a genesis-baked MXE, and it
# must be sealed (the only program with MPC circuits). market still deploys under
# its target/deploy keypair address; it needs no MXE.

[provider]
cluster = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test.validator]
startup_wait = 120000
# Deploy workspace programs upgradeable so the MXE bootstrap (init_mxe gates on
# the program's program_data/upgrade authority) can create the sealed MXE.
upgradeable = true
