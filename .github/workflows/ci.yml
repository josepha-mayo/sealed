name: CI

# Everything that doesn't need the Arcium localnet, on every push:
# harness unit tests, typecheck, the offline cryptographic audit of the
# committed snapshot, the headless browser-audit regression, and the
# submission pre-flight. The 17-test E2E needs `arcium localnet` and runs
# locally — see tests/sealed.ts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: yarn install --frozen-lockfile
      - name: market program unit tests (conservation, expiry, argmax, commitments)
        run: cargo test --manifest-path programs/market/Cargo.toml
      - name: harness unit tests
        run: yarn harness:test
      - name: harness typecheck
        run: npx tsc -p packages/harness --noEmit
      - name: offline cryptographic audit of the evidence snapshot
        run: node scripts/verify.mjs
      - name: in-browser audit regression (headless)
        run: node scripts/audit-browser-test.mjs
      - name: in-browser grant decryption regression (vendored RescueCipher + demo key)
        run: node scripts/decrypt-grants-test.mjs
      - name: integrity manifests (evidence bundle + served web assets)
        run: scripts/evidence-manifest.sh check && scripts/web-manifest.sh check
      - name: doc-count freshness (docs can't drift from the evidence bundle)
        run: node scripts/freshness.mjs
      - name: calibration rescore (recompute the MPC's arithmetic offline)
        run: node scripts/rescore.mjs --bank docs/evidence/calibration/bank.json --run docs/evidence/calibration/run-artifact.json --benchmark CSnhf6QySv3BszDkJ47KGooUx86PBpLxxi2iDz42S8fp --snapshot web/snapshot.json
      - name: artifact replay — all 138 committed artifacts re-verify in one pass
        run: yarn --cwd packages/harness -s cli chain artifact ../../docs/evidence --recursive --snapshot ../../web/snapshot.json
      - name: bundle fingerprint — every manifest-pinned byte re-hashed
        run: yarn --cwd packages/harness -s cli chain fingerprint
      - name: second-language verdict — stdlib Python recomputes the root + re-derives PDAs
        run: python3 scripts/verify.py && python3 scripts/verify.py --tamper
      - name: third-language sealed-exam read — Rescue+x25519 ported, grants decrypt bit-exact
        run: python3 scripts/verify.py --decrypt
      - name: capsule freshness — standalone.html is a byte-current mirror of the pinned bundle
        run: node scripts/gen-standalone.mjs --check
      - name: submission pre-flight
        run: node scripts/check-submission.mjs
